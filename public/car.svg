<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none" width="100%" height="100%">
  <defs>
    <!-- Car Body Metallic Gradient -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glass Gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Headlight Cone Glow -->
    <radialGradient id="headlightBeam" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Taillight Glow -->
    <radialGradient id="tailGlow" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Wheel Rim Metallic Gradient -->
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Underglow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Headlight Beam (Projects to the Right) -->
  <polygon points="960,260 1200,200 1200,350 960,285" fill="url(#headlightBeam)" opacity="0.85" />
  
  <!-- Underglow ground beam -->
  <ellipse cx="600" cy="365" rx="420" ry="22" fill="#0284c7" opacity="0.4" filter="url(#cyanGlow)" />

  <!-- Main Shadow beneath car -->
  <ellipse cx="600" cy="365" rx="450" ry="20" fill="#000000" opacity="0.8" />

  <!-- CAR BODY GROUP -->
  <g filter="url(#softShadow)">
    <!-- Rear Flare & Under-bumper -->
    <path d="M 180,310 L 220,350 L 960,350 L 1020,300 L 980,260 L 920,240 L 760,210 L 620,150 L 400,150 L 290,210 L 200,260 Z" fill="#0f172a" />

    <!-- Main Aerodynamic Body Shell -->
    <path d="M 160,310 
             C 170,270 200,250 250,245 
             C 320,240 400,220 480,180 
             C 540,150 630,135 730,155 
             C 800,170 870,205 920,230 
             C 970,255 1030,265 1040,290 
             C 1045,305 1035,325 1010,335 
             C 980,345 930,345 900,345 
             C 880,300 820,300 800,345 
             L 400,345 
             C 380,300 320,300 300,345 
             L 200,345 
             C 170,340 155,325 160,310 Z" 
          fill="url(#bodyGradient)" 
          stroke="#38bdf8" 
          stroke-width="2" />

    <!-- Side Accent Character Line -->
    <path d="M 230,270 Q 500,255 960,285" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.7" />
    <path d="M 280,290 Q 550,280 880,300" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.5" />

    <!-- Roof & Windshield Cabin -->
    <path d="M 415,185 
             C 470,155 570,145 680,162 
             C 750,173 810,200 840,225 
             L 480,225 Z" 
          fill="url(#glassGradient)" 
          stroke="#38bdf8" 
          stroke-width="1.5" />

    <!-- Side Window Pillar Splitter -->
    <line x1="590" y1="150" x2="610" y2="225" stroke="#0f172a" stroke-width="5" />
    <line x1="720" y1="167" x2="735" y2="225" stroke="#0f172a" stroke-width="4" />

    <!-- Interior Silhouette (Steering & Seats accent) -->
    <path d="M 540,205 Q 560,190 575,205 L 575,225 L 540,225 Z" fill="#334155" opacity="0.6" />

    <!-- Front Headlight Assembly -->
    <path d="M 980,270 L 1030,280 L 1005,292 Z" fill="#e0f2fe" />
    <polygon points="1010,275 1035,282 1025,290" fill="#38bdf8" />
    <circle cx="1020" cy="282" r="6" fill="#ffffff" filter="url(#cyanGlow)" />

    <!-- Rear Taillight Assembly -->
    <path d="M 162,295 L 185,290 L 180,308 L 160,305 Z" fill="#ef4444" filter="url(#cyanGlow)" />
    <line x1="160" y1="300" x2="220" y2="295" stroke="#f87171" stroke-width="4" filter="url(#cyanGlow)" />

    <!-- Air Intake & Bumper Detail -->
    <path d="M 930,320 L 1005,320 L 990,335 L 920,335 Z" fill="#020617" stroke="#1e293b" stroke-width="1" />
    <path d="M 220,320 L 270,320 L 265,335 L 215,335 Z" fill="#020617" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- WHEEL 1 (REAR WHEEL) -->
  <g transform="translate(350, 345)">
    <!-- Tire Outer -->
    <circle cx="0" cy="0" r="55" fill="#090d16" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="44" fill="#1e293b" />
    <!-- Brake Disc -->
    <circle cx="0" cy="0" r="32" fill="#475569" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2" />
    <!-- Brake Caliper -->
    <path d="M -20,-18 A 28 28 0 0 1 5,-27 L 3,-16 A 18 18 0 0 0 -14,-10 Z" fill="#0284c7" />
    <!-- Rim Base -->
    <circle cx="0" cy="0" r="26" fill="url(#rimGradient)" stroke="#e2e8f0" stroke-width="1" />
    <!-- 5 Spoke Alloy Design -->
    <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-24" />
      <line x1="0" y1="0" x2="22" y2="-8" />
      <line x1="0" y1="0" x2="14" y2="20" />
      <line x1="0" y1="0" x2="-14" y2="20" />
      <line x1="0" y1="0" x2="-22" y2="-8" />
    </g>
    <!-- Center Cap -->
    <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- WHEEL 2 (FRONT WHEEL) -->
  <g transform="translate(850, 345)">
    <!-- Tire Outer -->
    <circle cx="0" cy="0" r="55" fill="#090d16" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="44" fill="#1e293b" />
    <!-- Brake Disc -->
    <circle cx="0" cy="0" r="32" fill="#475569" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2" />
    <!-- Brake Caliper -->
    <path d="M -20,-18 A 28 28 0 0 1 5,-27 L 3,-16 A 18 18 0 0 0 -14,-10 Z" fill="#0284c7" />
    <!-- Rim Base -->
    <circle cx="0" cy="0" r="26" fill="url(#rimGradient)" stroke="#e2e8f0" stroke-width="1" />
    <!-- 5 Spoke Alloy Design -->
    <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-24" />
      <line x1="0" y1="0" x2="22" y2="-8" />
      <line x1="0" y1="0" x2="14" y2="20" />
      <line x1="0" y1="0" x2="-14" y2="20" />
      <line x1="0" y1="0" x2="-22" y2="-8" />
    </g>
    <!-- Center Cap -->
    <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
